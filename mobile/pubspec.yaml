name: dhatu_mobile
description: "Dhatu Informal E-Waste Collector Mobile Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.1.0
  intl: ^0.20.2
  provider: ^6.1.2
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  audioplayers: ^5.2.1
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  tflite_flutter: ^0.12.1
  uuid: ^4.3.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
